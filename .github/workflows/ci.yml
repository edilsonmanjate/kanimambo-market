name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Kanimambo.slnx

      - name: Build (warnings are errors)
        run: dotnet build Kanimambo.slnx -c Release --no-restore

      # Integration tests start PostgreSQL and Redis through Testcontainers (Docker is available on ubuntu-latest).
      - name: Test with coverage
        run: >
          dotnet test --solution Kanimambo.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory TestResults

      - name: Coverage report
        if: always()
        run: >
          dotnet reportgenerator
          -reports:"TestResults/*.cobertura.xml"
          -targetdir:TestResults/report
          -reporttypes:"MarkdownSummaryGithub;Cobertura;HtmlInline;Badges"
          -assemblyfilters:"+Kanimambo.*;-*Tests;-Kanimambo.AppHost;-Kanimambo.Testing;-Kanimambo.Simulators.*"
          -classfilters:"-*.Migrations.*;-Microsoft.AspNetCore.OpenApi.Generated*;-System.Runtime.CompilerServices*;-System.Text.RegularExpressions.Generated*"

      - name: Publish coverage summary
        if: always()
        run: cat TestResults/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/report

  # Coverage badges for the README: on every push to main, the badge SVGs from the report replace the content of
  # the orphan `badges` branch. Only this job may write to the repository, and only on main.
  publish-badges:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: report

      - name: Publish coverage badges to the badges branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badges
          cp report/badge_linecoverage.svg report/badge_branchcoverage.svg badges/
          cd badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Coverage badges for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
