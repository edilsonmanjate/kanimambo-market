name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Kanimambo.slnx

      - name: Build (warnings are errors)
        run: dotnet build Kanimambo.slnx -c Release --no-restore

      # Integration tests start PostgreSQL and Redis through Testcontainers (Docker is available on ubuntu-latest).
      - name: Test with coverage
        run: >
          dotnet test --solution Kanimambo.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory TestResults

      - name: Coverage report
        if: always()
        run: >
          dotnet reportgenerator
          -reports:"TestResults/*.cobertura.xml"
          -targetdir:TestResults/report
          -reporttypes:"MarkdownSummaryGithub;Cobertura;HtmlInline"
          -assemblyfilters:"+Kanimambo.*;-*Tests;-Kanimambo.AppHost"
          -classfilters:"-*.Migrations.*;-Microsoft.AspNetCore.OpenApi.Generated*;-System.Runtime.CompilerServices*"

      - name: Publish coverage summary
        if: always()
        run: cat TestResults/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/report
